{% extends "base.html" %}{% block title %}Precio{% endblock %}{% block header %}{{'Editar precio' if precio else 'Nuevo precio'}}{% endblock %}{% block content %}<div class="card form-card"><form method="POST" class="formulario"><div class="form-grid"><div><label>Fruta</label><input name="fruta" required value="{{precio.fruta if precio else ''}}"></div><div><label>Variedad</label><input name="variedad" required value="{{precio.variedad if precio else ''}}"></div><div><label>Calidad</label><select name="calidad" required>{% for c in ['Excelente','Buena','Regular'] %}<option {% if precio and precio.calidad==c %}selected{% endif %}>{{c}}</option>{% endfor %}</select></div><div><label>Precio por kg</label><input type="number" step="0.01" min="0" name="precio_kg" required value="{{precio.precio_kg if precio else ''}}"></div></div><div class="form-actions"><a class="boton-secundario" href="{{url_for('precios')}}">Cancelar</a><button class="boton">Guardar</button></div></form></div>{% endblock %}
