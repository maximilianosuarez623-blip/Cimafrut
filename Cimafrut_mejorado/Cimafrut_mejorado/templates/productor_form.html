{% extends 'base.html' %}{% block header %}{{'Editar productor' if productor else 'Nuevo productor'}}{% endblock %}{% block content %}<form method="POST" class="card form-narrow"><div class="grid2"><div><label>Nombre *</label><input name="nombre" value="{{productor.nombre if productor else ''}}" required></div><div><label>Apellido *</label><input name="apellido" value="{{productor.apellido if productor else ''}}" required></div><div><label>DNI/CUIT *</label><input name="dni" value="{{productor.dni if productor else ''}}" required></div><div><label>Teléfono</label><input name="telefono" value="{{productor.telefono if productor else ''}}"></div><div><label>Email</label><input name="email" value="{{productor.email if productor else ''}}"></div><div><label>Localidad</label><input name="localidad" value="{{productor.localidad if productor else ''}}"></div></div><div class="form-actions"><a class="btn-secondary" href="{{url_for('productores')}}">Cancelar</a><button class="btn-primary">Guardar</button></div></form>{% endblock %}
