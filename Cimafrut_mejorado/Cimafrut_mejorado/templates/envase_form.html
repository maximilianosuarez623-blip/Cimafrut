{% extends 'base.html' %}{% block title %}Envase{% endblock %}{% block header %}{{'Editar envase' if envase else 'Nuevo tipo de envase'}}{% endblock %}{% block subtitle %}Peso vacío utilizado para calcular la tara{% endblock %}{% block content %}<form method="POST" class="card form-narrow"><label>Tipo de envase *</label><input name="nombre" value="{{envase.nombre if envase else ''}}" required placeholder="Ej.: Cajón plástico"><label>Peso vacío (kg) *</label><input name="peso_vacio" type="number" step="0.01" min="0" value="{{envase.peso_vacio if envase else ''}}" required>{% if envase %}<label class="check"><input type="checkbox" name="activo" {% if envase.activo %}checked{% endif %}> Activo</label>{% endif %}<div class="form-actions"><a class="btn-secondary" href="{{url_for('envases')}}">Cancelar</a><button class="btn-primary">Guardar</button></div></form>{% endblock %}
