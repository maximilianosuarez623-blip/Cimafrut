{% extends "base.html" %}{% block title %}Nuevo vale{% endblock %}{% block header %}Nuevo vale de ingreso{% endblock %}{% block content %}<div class="card form-card"><form method="POST" class="formulario"><label>Productor</label><select name="productor_id" required><option value="">Seleccionar...</option>{% for p in productores %}<option value="{{p.id}}">{{p.apellido}}, {{p.nombre}} - DNI {{p.dni}}</option>{% endfor %}</select><div class="form-grid"><div><label>Fruta</label><select name="fruta" id="fruta" required><option value="">Seleccionar...</option>{% for f in precios|map(attribute='fruta')|unique %}<option>{{f}}</option>{% endfor %}</select></div><div><label>Variedad</label><select name="variedad" id="variedad" required></select></div><div><label>Calidad</label><select name="calidad" id="calidad" required></select></div><div><label>Kilos</label><input name="kilos" id="kilos" type="number" step="0.01" min="0.01" required></div></div><div class="precio-preview">Precio: <b id="precio">$0.00/kg</b> · Importe: <b id="importe">$0.00</b></div><div class="form-actions"><a class="boton-secundario" href="{{url_for('vales')}}">Cancelar</a><button class="boton">Crear vale</button></div></form></div><script>
const datos={{precios|tojson}}; const f=document.getElementById('fruta'),v=document.getElementById('variedad'),c=document.getElementById('calidad'),k=document.getElementById('kilos');
function actV(){v.innerHTML='<option value="">Seleccionar...</option>';[...new Set(datos.filter(x=>x.fruta===f.value).map(x=>x.variedad))].forEach(x=>v.insertAdjacentHTML('beforeend',`<option>${x}</option>`));c.innerHTML='<option value="">Seleccionar...</option>';calc()}
function actC(){c.innerHTML='<option value="">Seleccionar...</option>';[...new Set(datos.filter(x=>x.fruta===f.value&&x.variedad===v.value).map(x=>x.calidad))].forEach(x=>c.insertAdjacentHTML('beforeend',`<option>${x}</option>`));calc()}
function calc(){let x=datos.find(x=>x.fruta===f.value&&x.variedad===v.value&&x.calidad===c.value),p=x?Number(x.precio_kg):0;document.getElementById('precio').textContent=`$${p.toFixed(2)}/kg`;document.getElementById('importe').textContent=`$${(p*(Number(k.value)||0)).toFixed(2)}`}
f.onchange=actV;v.onchange=actC;c.onchange=calc;k.oninput=calc;
</script>{% endblock %}
