{% extends "base.html" %}{% block title %}Productor{% endblock %}{% block header %}{{'Editar productor' if productor else 'Nuevo productor'}}{% endblock %}{% block content %}<div class="card form-card"><form method="POST" class="formulario"><div class="form-grid"><div><label>Nombre</label><input name="nombre" required value="{{productor.nombre if productor else ''}}"></div><div><label>Apellido</label><input name="apellido" required value="{{productor.apellido if productor else ''}}"></div><div><label>DNI</label><input name="dni" required value="{{productor.dni if productor else ''}}"></div><div><label>Teléfono</label><input name="telefono" value="{{productor.telefono if productor else ''}}"></div><div><label>Email</label><input name="email" type="email" value="{{productor.email if productor else ''}}"></div><div><label>Localidad</label><input name="localidad" value="{{productor.localidad if productor else ''}}"></div></div><div class="form-actions"><a class="boton-secundario" href="{{url_for('productores')}}">Cancelar</a><button class="boton">Guardar</button></div></form></div>{% endblock %}
